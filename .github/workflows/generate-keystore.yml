name: 🔑 Generate Android Signing Keystore (Run Once)

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore & Key Password (min 6 chars)'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔑 Generate Signing Keystore
        run: |
          keytool -genkey -v \
            -keystore forge-release-key.keystore \
            -alias forge-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=Neeraj, OU=FORGE, O=ForgeGymTracker, L=India, S=India, C=IN"
          
          echo ""
          echo "=== SHA-256 FINGERPRINT (copy this for assetlinks.json) ==="
          keytool -list -v \
            -keystore forge-release-key.keystore \
            -alias forge-key \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            | grep "SHA256:"
          
          echo ""
          echo "=== BASE64 ENCODED KEYSTORE (copy this for GitHub Secret) ==="
          base64 -w 0 forge-release-key.keystore

      - name: 📤 Upload Keystore as Artifact (PRIVATE — expires in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: forge-release-keystore-PRIVATE
          path: forge-release-key.keystore
          retention-days: 1
