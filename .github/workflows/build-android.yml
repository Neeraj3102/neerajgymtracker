name: 🏋️ Build FORGE Android App (APK + AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version to stamp (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

jobs:
  build:
    name: Build Signed Android Bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;34.0.0'

      - name: 🛠️ Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          
          # Fix Bubblewrap legacy AndroidSdkTools.validatePath() check
          mkdir -p "${ANDROID_HOME}/tools"
          ln -sf "${ANDROID_HOME}/cmdline-tools/latest/bin" "${ANDROID_HOME}/bin" 2>/dev/null || true
          
          # Auto-accept all Android SDK licenses
          yes | sdkmanager --licenses 2>/dev/null || true
          
          # Symlink pre-installed build-tools to 36.1.0 to satisfy Bubblewrap checkBuildTools()
          LATEST_BT=$(ls -d ${ANDROID_HOME}/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_BT" ] && [ ! -d "${ANDROID_HOME}/build-tools/36.1.0" ]; then
            echo "Symlinking $LATEST_BT to ${ANDROID_HOME}/build-tools/36.1.0"
            ln -sf "$LATEST_BT" "${ANDROID_HOME}/build-tools/36.1.0"
          fi
          ls -la "${ANDROID_HOME}/build-tools"
          echo "✅ Android SDK and Bubblewrap configured"

      - name: 🔑 Decode Signing Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          echo "✅ Keystore decoded successfully"

      - name: 🏗️ Update/Generate Android Project from twa-manifest.json
        run: |
          bubblewrap update --skipVersionUpgrade
          node -e "const crypto=require('crypto'),fs=require('fs'); fs.writeFileSync('manifest-checksum.txt', crypto.createHash('sha1').update(fs.readFileSync('twa-manifest.json')).digest('hex'));"
          echo "✅ Project generated and checksum saved"

      - name: 📦 Build and Sign Android APK and AAB
        run: |
          chmod +x ./gradlew || true
          
          # 1. Bubblewrap build without internal signing (avoids apksigner quote bug)
          if ! bubblewrap build --skipSigning --skipPwaValidation > build.log 2>&1; then
            cat build.log
            ERR=$(sed -n '/\* Where:/,/\* Try:/p' build.log | tr '\r\n' '  ')
            [ -z "$ERR" ] && ERR=$(grep -A 8 -B 1 "FAILURE: Build failed" build.log | tr '\r\n' '  ')
            [ -z "$ERR" ] && ERR=$(tail -n 25 build.log | grep -v '^\s*at ' | tr '\r\n' '  ')
            echo "::error title=Bubblewrap Build Failed::$ERR"
            exit 1
          fi
          cat build.log
          
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          # 2. Locate generated APK and sign with apksigner
          RAW_APK=$(find . -name "*release-unsigned.apk" -o -name "*release.apk" 2>/dev/null | head -n 1)
          echo "Found unsigned APK at: $RAW_APK"
          $BUILD_TOOLS_DIR/zipalign -v -f -p 4 "$RAW_APK" FORGE-aligned.apk || cp "$RAW_APK" FORGE-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out FORGE-release.apk FORGE-aligned.apk
          
          # 3. Locate generated AAB and sign with jarsigner
          RAW_AAB=$(find . -name "*.aab" 2>/dev/null | head -n 1)
          echo "Found unsigned AAB at: $RAW_AAB"
          $JAVA_HOME/bin/jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -signedjar FORGE-release.aab "$RAW_AAB" "${{ secrets.ANDROID_KEY_ALIAS }}"
          
          # 4. Verify signatures
          $BUILD_TOOLS_DIR/apksigner verify FORGE-release.apk
          $JAVA_HOME/bin/jarsigner -verify FORGE-release.aab
          ls -lh FORGE-release.apk FORGE-release.aab

      - name: 🔒 Clean Up Keystore
        if: always()
        run: rm -f release.keystore && echo "✅ Keystore deleted"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-APK-v${{ github.run_number }}
          path: FORGE-release.apk
          retention-days: 30

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-AAB-v${{ github.run_number }}
          path: FORGE-release.aab
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🏋️ FORGE Android Build Status" >> $GITHUB_STEP_SUMMARY
          if [ -f "FORGE-release.apk" ] && [ -f "FORGE-release.aab" ]; then
            echo "### ✅ Build & Signature Completed Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| APK (Side-load / Direct Install) | \`FORGE-release.apk\` | $(ls -lh FORGE-release.apk | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
            echo "| AAB (Google Play Store Bundle) | \`FORGE-release.aab\` | $(ls -lh FORGE-release.aab | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Log Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
