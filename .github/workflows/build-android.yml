name: 🏋️ Build FORGE Android App (APK + AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version to stamp (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

jobs:
  build:
    name: Build Signed Android Bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.1.0'

      - name: 🛠️ Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: 🔑 Decode Signing Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          echo "✅ Keystore decoded successfully"

      - name: 🏗️ Update/Generate Android Project from twa-manifest.json
        run: |
          bubblewrap update --skipVersionUpgrade
          node -e "const crypto=require('crypto'),fs=require('fs'); fs.writeFileSync('manifest-checksum.txt', crypto.createHash('sha1').update(fs.readFileSync('twa-manifest.json')).digest('hex'));"
          echo "✅ manifest-checksum.txt generated"

      - name: 📦 Build Signed APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew || true
          
          # Attempt Bubblewrap build with explicit key parameters
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath release.keystore \
            --signingKeyAlias "${{ secrets.ANDROID_KEY_ALIAS }}" || true

          # Direct fallback if Bubblewrap CLI hit prompts or signing flags
          if [ ! -f "app-release-signed.apk" ]; then
            echo "Running direct Gradle compile..."
            ./gradlew assembleRelease bundleRelease || true
            
            BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
            echo "Using build tools from $BUILD_TOOLS_DIR"
            
            UNSIGNED_APK=$(find . -name "*release-unsigned.apk" -o -name "*release.apk" 2>/dev/null | head -n 1)
            if [ -n "$UNSIGNED_APK" ] && [ -f "$UNSIGNED_APK" ]; then
              $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk || cp "$UNSIGNED_APK" app-aligned.apk
              $BUILD_TOOLS_DIR/apksigner sign \
                --ks release.keystore \
                --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
                --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
                --out app-release-signed.apk app-aligned.apk
              echo "✅ app-release-signed.apk created"
            fi
            
            UNSIGNED_AAB=$(find . -name "*.aab" 2>/dev/null | head -n 1)
            if [ -n "$UNSIGNED_AAB" ] && [ -f "$UNSIGNED_AAB" ]; then
              jarsigner -verbose \
                -sigalg SHA256withRSA \
                -digestalg SHA-256 \
                -keystore release.keystore \
                -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
                -signedjar app-release-bundle.aab "$UNSIGNED_AAB" "${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "✅ app-release-bundle.aab created"
            fi
          fi

          ls -lh *.apk *.aab 2>/dev/null || true

      - name: 🔒 Clean Up Keystore
        if: always()
        run: rm -f release.keystore && echo "✅ Keystore deleted"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-APK-v${{ github.run_number }}
          path: |
            app-release-signed.apk
            *.apk
            app/build/outputs/**/*.apk
          retention-days: 30

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-AAB-v${{ github.run_number }}
          path: |
            app-release-bundle.aab
            *.aab
            app/build/outputs/**/*.aab
          retention-days: 30

      - name: 📊 Build Summary
        run: |
          echo "## 🏋️ FORGE Android Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| APK (Side-load) | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
          echo "| AAB (Play Store) | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
