name: 🏋️ Build FORGE Android App (APK + AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version to stamp (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

jobs:
  build:
    name: Build Signed Android Bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.1.0'

      - name: 🛠️ Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: 🔑 Decode Signing Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          echo "✅ Keystore decoded successfully"

      - name: 🏗️ Update/Generate Android Project from twa-manifest.json
        run: |
          bubblewrap update --skipVersionUpgrade
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle app/build.gradle 2>/dev/null || true
          echo "✅ Project generated and repositories configured"

      - name: 📦 Build Signed APK and AAB
        run: |
          chmod +x ./gradlew
          
          echo "=== 1. Building Release APK and AAB via Gradle ==="
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          
          echo "=== 2. Discovering outputs ==="
          find app/build/outputs -type f -name "*.apk" -o -name "*.aab"
          
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          echo "Android Build Tools: $BUILD_TOOLS_DIR"
          
          # Find generated APK
          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"
          if [ -n "$RAW_APK" ] && [ -f "$RAW_APK" ]; then
            # Verify if already signed, or sign with apksigner
            if $BUILD_TOOLS_DIR/apksigner verify "$RAW_APK" 2>/dev/null; then
              echo "APK is already signed by Gradle injection!"
              cp "$RAW_APK" app-release-signed.apk
            else
              echo "Signing APK with apksigner..."
              $BUILD_TOOLS_DIR/zipalign -v -f -p 4 "$RAW_APK" app-release-aligned.apk || cp "$RAW_APK" app-release-aligned.apk
              $BUILD_TOOLS_DIR/apksigner sign \
                --ks release.keystore \
                --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
                --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
                --out app-release-signed.apk app-release-aligned.apk
            fi
            echo "✅ app-release-signed.apk ready"
          fi
          
          # Find generated AAB
          RAW_AAB=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          echo "Found AAB: $RAW_AAB"
          if [ -n "$RAW_AAB" ] && [ -f "$RAW_AAB" ]; then
            jarsigner -verify "$RAW_AAB" 2>/dev/null && echo "AAB verified signed" || \
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              -signedjar app-release-bundle.aab "$RAW_AAB" "${{ secrets.ANDROID_KEY_ALIAS }}"
            [ ! -f "app-release-bundle.aab" ] && cp "$RAW_AAB" app-release-bundle.aab
            echo "✅ app-release-bundle.aab ready"
          fi

          ls -lh app-release-signed.apk app-release-bundle.aab

      - name: 🔒 Clean Up Keystore
        if: always()
        run: rm -f release.keystore && echo "✅ Keystore deleted"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-APK-v${{ github.run_number }}
          path: |
            app-release-signed.apk
            *.apk
            app/build/outputs/**/*.apk
          retention-days: 30

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-AAB-v${{ github.run_number }}
          path: |
            app-release-bundle.aab
            *.aab
            app/build/outputs/**/*.aab
          retention-days: 30

      - name: 📊 Build Summary
        run: |
          echo "## 🏋️ FORGE Android Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| APK (Side-load) | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
          echo "| AAB (Play Store) | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
