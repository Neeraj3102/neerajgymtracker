name: 🏋️ Build FORGE Android App (APK + AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version to stamp (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

jobs:
  build:
    name: Build Signed Android Bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;34.0.0'

      - name: 🛠️ Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          
          # Fix Bubblewrap legacy AndroidSdkTools.validatePath() check
          mkdir -p "${ANDROID_HOME}/tools"
          ln -sf "${ANDROID_HOME}/cmdline-tools/latest/bin" "${ANDROID_HOME}/bin" 2>/dev/null || true
          
          # Auto-accept all Android SDK licenses
          yes | sdkmanager --licenses 2>/dev/null || true
          
          # Copy pre-installed build-tools to 36.1.0 to satisfy Bubblewrap checkBuildTools() without symlink breakage
          LATEST_BT=$(ls -d ${ANDROID_HOME}/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_BT" ] && [ ! -d "${ANDROID_HOME}/build-tools/36.1.0" ]; then
            echo "Copying $LATEST_BT to ${ANDROID_HOME}/build-tools/36.1.0"
            cp -r "$LATEST_BT" "${ANDROID_HOME}/build-tools/36.1.0"
          fi
          ls -la "${ANDROID_HOME}/build-tools"
          echo "✅ Android SDK and Bubblewrap configured"

      - name: 🔑 Decode Signing Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n\t ' | base64 --decode > release.keystore
          echo "✅ Keystore decoded successfully"

      - name: 🏗️ Update/Generate Android Project from twa-manifest.json
        run: |
          bubblewrap update --skipVersionUpgrade
          node -e "const crypto=require('crypto'),fs=require('fs'); fs.writeFileSync('manifest-checksum.txt', crypto.createHash('sha1').update(fs.readFileSync('twa-manifest.json')).digest('hex'));"
          echo "✅ Project generated and checksum saved"

      - name: 📦 Build Signed APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew || true
          
          # Strip accidental tabs or spaces from secrets
          export BUBBLEWRAP_KEYSTORE_PASSWORD=$(echo "$BUBBLEWRAP_KEYSTORE_PASSWORD" | tr -d '\r\n\t ')
          export BUBBLEWRAP_KEY_PASSWORD=$(echo "$BUBBLEWRAP_KEY_PASSWORD" | tr -d '\r\n\t ')
          
          # Patch Bubblewrap CLI password quoting and argument bug
          node patch-bubblewrap.js
          
          if ! bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath release.keystore \
            --signingKeyAlias "${{ secrets.ANDROID_KEY_ALIAS }}" > build.log 2>&1; then
            cat build.log
            ERR=$(sed -n '/\* Where:/,/\* Try:/p' build.log | tr '\r\n' '  ')
            [ -z "$ERR" ] && ERR=$(grep -A 8 -B 1 "FAILURE: Build failed" build.log | tr '\r\n' '  ')
            [ -z "$ERR" ] && ERR=$(tail -n 25 build.log | grep -v '^\s*at ' | tr '\r\n' '  ')
            echo "::error title=Bubblewrap Build Failed::$ERR"
            exit 1
          fi
          
          cat build.log
          cp app-release-signed.apk FORGE-release.apk
          cp app-release-bundle.aab FORGE-release.aab
          ls -lh FORGE-release.apk FORGE-release.aab

      - name: 🔒 Clean Up Keystore
        if: always()
        run: rm -f release.keystore && echo "✅ Keystore deleted"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-APK-v${{ github.run_number }}
          path: FORGE-release.apk
          retention-days: 30

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-AAB-v${{ github.run_number }}
          path: FORGE-release.aab
          retention-days: 30

      - name: 🚀 Publish Public GitHub Release (Direct Single-Tap Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_bump || format('v1.0.{0}', github.run_number) }}
          name: FORGE Android ${{ github.event.inputs.version_bump || format('v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          body: |
            ## 🏋️ FORGE Gym Tracker Android App
            Direct single-tap download (no login, no unzipping required):
            - 📲 **[Download FORGE-release.apk](https://github.com/Neeraj3102/neerajgymtracker/releases/download/${{ github.event.inputs.version_bump || format('v1.0.{0}', github.run_number) }}/FORGE-release.apk)**
            - 📦 **[Download FORGE-release.aab](https://github.com/Neeraj3102/neerajgymtracker/releases/download/${{ github.event.inputs.version_bump || format('v1.0.{0}', github.run_number) }}/FORGE-release.aab)**
          files: |
            FORGE-release.apk
            FORGE-release.aab

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🏋️ FORGE Android Build Status" >> $GITHUB_STEP_SUMMARY
          if [ -f "FORGE-release.apk" ] && [ -f "FORGE-release.aab" ]; then
            echo "### ✅ Build & Signature Completed Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| APK (Side-load / Direct Install) | \`FORGE-release.apk\` | $(ls -lh FORGE-release.apk | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
            echo "| AAB (Google Play Store Bundle) | \`FORGE-release.aab\` | $(ls -lh FORGE-release.aab | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Log Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
